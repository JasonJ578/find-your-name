<!DOCTYPE html>

<!-- PAGE-MODE: flow -->

<header class="wb-header">

      <span class="wb-logo-mark">微</span>

    </a>
    <div class="wb-search">
      <input type="search" placeholder="搜索微界内容" aria-label="搜索">

    <nav class="wb-header-actions" aria-label="顶部导航">
      <a href="index.html">首页</a>
      <a href="profile-01.html">我</a>
      <span class="avatar avatar-sm avatar-blue" aria-hidden="true">林</span>
    </nav>
  </div>
</header>

<main class="wb-detail">
  <a class="wb-back" href="index.html">← 返回首页</a>

  <section class="wb-profile">
    <div class="wb-profile-cover"></div>
    <div class="wb-profile-main">

        <span><b>128</b> 关注</span>
        <span><b>1.2万</b> 粉丝</span>
        <span><b>346</b> 微博</span>
      </div>
      <div class="wb-profile-actions">
        <button class="btn" type="button">关注</button>
        <button class="btn btn-ghost" type="button">私信</button>
      </div>
    </div>

  <nav class="wb-tabs" aria-label="个人主页分类">
    <a class="wb-tab is-active" href="#">微博</a>
    <a class="wb-tab" href="#">相册</a>
    <a class="wb-tab" href="#">赞</a>
  </nav>

  <article class="wb-post" data-post="p01">
    <header class="wb-post-head">
      <span class="avatar avatar-blue" aria-hidden="true">林</span>
      <div class="wb-post-meta">
        <span class="wb-user">林晚 <span class="wb-v">V</span></span>
        <span class="wb-time">3 小时前 · 来自 微界网页版</span>
      </div>
      <button class="wb-more" type="button" aria-label="更多">···</button>

    <p class="wb-post-text">昨晚 23:40 我还在公司，整层楼只剩我一个。走的时候，<span class="hashtag">#消防通道</span> 的门是开着的。</p>
    <div class="wb-post-media">
      <div class="wb-media">图片占位 · 消防通道</div>
    </div>
    <footer class="wb-post-actions">
      <a class="wb-action" href="post-01.html">评论 12</a>
      <span class="wb-action">转发 4</span>
      <span class="wb-action">赞 27</span>
    </footer>
  </article>

  <article class="wb-post" data-post="p05">
    <header class="wb-post-head">
      <span class="avatar avatar-blue" aria-hidden="true">林</span>
      <div class="wb-post-meta">
        <span class="wb-user">林晚 <span class="wb-v">V</span></span>
        <span class="wb-time">昨天 20:12 · 来自 微界网页版</span>
      </div>
      <button class="wb-more" type="button" aria-label="更多">···</button>
    </header>
    <p class="wb-post-text">加班第三天。楼下的便利店关得越来越早，只有江边的雾准时。</p>
    <footer class="wb-post-actions">
      <span class="wb-action">评论 3</span>
      <span class="wb-action">转发 0</span>
      <span class="wb-action">赞 11</span>
